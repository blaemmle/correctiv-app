# Quality gate for every PR and every push to main.
#
# Three jobs, cheapest first:
#   check         — typecheck every package, oxlint, oxfmt --check, headless tests
#                   (~1 min incl. install; no Android SDK, no emulator)
#   web           — static web export of apps/mobile, plus assertions that it is
#                   not silently broken (see the job for why). Built for a domain
#                   root; pages.yml rebuilds the same export under the Pages base
#                   path and publishes it.
#   android       — Android APK of the app, and only when the change could reach it.
#                   It costs a quarter of an hour against the other two together
#                   costing two minutes, and the handbook, the ADRs and the
#                   screenshots cannot break a native build. `check` works out which
#                   kind of change this is; see the step that does it.
#
# The repo is an npm workspace: `npm ci` runs at the root. Behaviour lives in
# packages/app-core, which is why `check` is worth running on its own before either
# build — see ARCHITECTURE.md and adr/0006-one-core-two-hosts.md.
#
# The Android job builds the RELEASE variant on purpose: `assembleDebug` skips the JS
# bundle task, and Metro resolution is exactly what breaks in this workspace (see the
# disableHierarchicalLookup entry in TROUBLESHOOTING.md). A debug APK would compile
# happily past that.
name: CI

on:
  # Every pull request, not just those targeting main — otherwise a stacked PR
  # (e.g. a spike branched off a feature branch) silently gets no gate at all.
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# On a branch, a new push makes the running check pointless and cancelling it is
# right. On `main` it is not: every merge commit is a state somebody can bisect
# to or deploy from, and a cancelled run means that state was never checked.
#
# Seven merges landed on 2026-09-15 and most of `main`'s runs were cancelled by
# the next one. That is how run #358 went unnoticed — the Android build failed on
# `main` right after #139 merged, and `gh pr checks 139` shows green because it
# reports the newest run against the pull request's head, not the one on `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc over every workspace, then oxlint, oxfmt --check, jest and vitest.
      # Includes the boundary guard that keeps the core free of platform SDKs.
      - name: Check
        run: npm run check

      # Whether the Android job has anything to say about this change. It is the
      # expensive job by an order of magnitude, and a whole class of change cannot
      # reach it: the handbook is a separate site, `tools/` ships with nothing, and
      # the ADRs and the screenshots are read by people. Everything else runs it,
      # because the list below is what to SKIP and a new directory therefore
      # defaults to building. Any doubt, including this step failing, also builds:
      # a build that ran for nothing costs fifteen minutes, one that was skipped and
      # should not have been costs a broken app nobody sees until the release.
      - name: Can this change reach the Android build
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          # `|| true` because the runner starts this script with `bash -e`: without
          # it a failed call ends the step here, and the empty-file branch below,
          # which is the whole fail-safe, never runs.
          if [ "${{ github.event_name }}" = pull_request ]; then
            gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename' > changed.txt || true
          else
            gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" --jq '.files[].filename' > changed.txt || true
          fi
          # Empty means the call failed. 300 is where the compare endpoint truncates
          # its file list, and a truncated list can hide the one file that matters.
          if [ ! -s changed.txt ] || [ "$(wc -l < changed.txt)" -ge 300 ]; then
            echo "the changed files are unreadable or truncated; building to be safe"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP='^(apps/handbook/|tools/|screens/|adr/|docs/|\.vscode/|\.github/workflows/pages\.yml$|[^/]+\.md$|[^/]+\.png$|\.editorconfig$)'
          if grep -Ev "$SKIP" changed.txt > reaching.txt; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Android build runs; these files reach it:"
            head -20 reaching.txt
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "Android build skipped; nothing here reaches it:"
            head -20 changed.txt
          fi

  web:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        working-directory: apps/mobile
        run: npm run build:web

      # The export succeeding is NOT sufficient on its own: a component with no
      # web implementation still exports fine. react-native-webview in
      # particular renders "React Native WebView does not support this platform."
      # So assert the built output does not contain that text, and that the
      # routes we expect were actually emitted.
      - name: Assert the web bundle is not silently broken
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if grep -rq "does not support this platform" dist/; then
            echo "::error::A component without web support reached the web bundle."
            grep -rl "does not support this platform" dist/ | head
            exit 1
          fi
          # Rozenite is development-only tooling and must not reach a shipped
          # bundle. The deploy workflow asserts this too, but only on a push to
          # main — which is after the merge. A `require` moved inside a function
          # would go green here and break the deploy afterwards, and the whole
          # argument for this check is that the failure is invisible otherwise:
          # a no-op module still carries its export names (ADR 0026 §1).
          test -d dist || { echo "::error::dist is missing — the export produced nothing"; exit 1; }
          if grep -riq 'rozenite' dist/; then
            echo "::error::the web bundle carries Rozenite. Check that metro.config.js still passes an explicit enabled, and that both requires are selected at MODULE scope."
            grep -ril 'rozenite' dist/ | head
            exit 1
          fi
          for route in index 404 artikel entdecken mediathek mitmachen profil; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html"; exit 1; }
          done
          # One real id per dynamic family. A route that loses its
          # generateStaticParams exports as a single dist/<family>/[id].html and
          # every real URL under it 404s on a static host, while the build and
          # every test stay green. __tests__/web-target.test.ts keeps the export
          # on the route; this checks that the ids actually came out.
          for route in projekt/abriss-atlas aufruf/wem-gehoert-die-stadt serie/klima tagebuch/diary-bern-2 behauptung/claim-001; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html — a dynamic route did not pre-render its ids"; exit 1; }
          done
          echo "web export OK — $(find dist -name '*.html' | wc -l) routes, no unsupported-platform stubs"

      # The handbook is the other half of what Pages publishes, and it can break on
      # its own: it reads the repository's Markdown at build time, so a document
      # renamed or a link rewritten to a path that no longer exists fails here and
      # nowhere else. Its tests run in the `check` job; this is the build.
      - name: Build the handbook
        run: npm run build -w @correctiv/handbook

      - name: Assert the handbook is not silently empty
        run: |
          set -euo pipefail
          test -f apps/handbook/dist/404.html || {
            echo "::error::apps/handbook/dist/404.html is missing — every deep link would 404 on Pages."
            exit 1
          }
          # A handbook that shipped no documents still renders its navigation.
          grep -rq "platform-free" apps/handbook/dist/assets/*.js || {
            echo "::error::the handbook bundle carries none of the repository's documents."
            exit 1
          }
          echo "handbook OK"

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-web
          path: apps/mobile/dist
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: check
    # Decided one job up, off the changed files. Nothing requires this check to
    # report, so a skip does not hold a merge; to build anyway, run
    # release-android.yml by hand, which produces the same APK on the run itself.
    if: needs.check.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      # Workspace root — installs every package and links @correctiv/app-core.
      - name: Install dependencies
        run: npm ci

      # android/ is gitignored: it is generated from app.json. --no-install because
      # npm ci already ran at the ROOT; letting prebuild install inside the app would
      # give it a private node_modules and break the workspace's hoisting.
      - name: Prebuild the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Autolinking gives a package's native module, but only its CONFIG PLUGIN edits
      # the native project — and a plugin has to be listed in app.json. expo-audio was
      # once missing from that list, so the manifest had no media service and
      # background playback could not work, with every check green. Read what prebuild
      # actually wrote rather than trusting that it ran.
      - name: Assert the generated manifest carries what the plugins promise
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for needle in \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' \
            'expo.modules.audio.service.AudioControlsService' \
            'android:foregroundServiceType="mediaPlayback"'; do
            grep -q "$needle" "$MANIFEST" || {
              echo "::error::$needle missing from the generated manifest"
              cat "$MANIFEST"
              exit 1
            }
          done
          echo "manifest OK — media playback service and permission present"

      # arm64-v8a for a real demo device, x86_64 so the APK also installs on an
      # emulator. Skipping armeabi-v7a and x86 roughly halves the native build.
      # `:app:mergeExtDexRelease` died twice on 2026-09-15 with
      # `java.lang.OutOfMemoryError: Java heap space` — run #356 on the branch and
      # run #358 on `main` after the merge — and a retry passed both times. The
      # heap is marginal for this dependency set rather than short, which is the
      # worse of the two: a check that fails at random is one nobody reads, and
      # this one put a red mark on a merged pull request whose code was fine.
      #
      # 2048m is what the React Native ecosystem's own `gradle.properties` files
      # all carry and what `expo prebuild` writes. D8 merges dex in the Gradle
      # daemon, so this is the daemon's heap, and the runner has 16 GB.
      - name: Give the dex merge room to finish
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Addressed from `apps/mobile` rather than from `android/`, and created
          # rather than assumed: `android/` is generated by prebuild and what it
          # writes is a template this repository does not hold, so neither the
          # directory nor the file is ours to take for granted. The first version
          # of this step ran in `android/` and failed before its first command,
          # with no output to say why.
          mkdir -p android
          touch android/gradle.properties
          sed -i '/^org\.gradle\.jvmargs=/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> android/gradle.properties
          echo "heap now:"
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build Android (release)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
